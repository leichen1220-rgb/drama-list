<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17131f"><title>我的劇單</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>
:root{--bg:#0f0d13;--card:#1b1722;--card2:#241e2d;--text:#f5f0fa;--muted:#aaa0b4;--accent:#b68cff;--line:#342b40;--ok:#7bdca7;--danger:#ff8e9e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px 14px 100px}.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 16px}h1{font-size:27px;margin:2px 0 4px}.sub{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:var(--card);padding:11px;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{flex:1;min-width:180px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px;font-size:15px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 3px}.tab,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:14px}.tab.on{background:var(--accent);color:#160d20;border-color:var(--accent);font-weight:700}.list{display:grid;gap:9px;margin-top:12px}.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:17px;font-weight:750}.meta{color:var(--muted);font-size:12px;margin-top:4px}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted)}.progress{display:flex;align-items:center;gap:8px;margin-top:10px}.bar{height:7px;background:#30283a;border-radius:9px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--accent)}.small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:6px;margin-top:10px}.actions button{border:0;background:var(--card2);color:var(--text);border-radius:10px;padding:7px 10px}.fab{position:fixed;right:18px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#160d20;font-size:30px;box-shadow:0 8px 30px #0008}.sheet{position:fixed;inset:0;background:#0009;display:none;z-index:20;align-items:flex-end}.sheet.on{display:flex}.panel{background:#17131f;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field.full{grid-column:1/-1}.save{width:100%;border:0;background:var(--accent);color:#160d20;border-radius:13px;padding:13px;font-weight:800;font-size:16px}.io{display:flex;gap:8px;margin-top:9px}.io .btn{flex:1;text-align:center}.empty{text-align:center;color:var(--muted);padding:50px 10px}@media(min-width:700px){.list{grid-template-columns:1fr 1fr}.panel{max-width:620px;margin:auto;border-radius:22px 22px 0 0}.fab{right:calc((100vw - 920px)/2 + 18px)}}
</style><script src="data.js"></script></head><body><div class="wrap"><div class="top"><h1>我的劇單</h1><div class="sub" id="saveState">資料存在這台裝置</div><div class="stats"><div class="stat"><b id="sAll">0</b><span>全部</span></div><div class="stat"><b id="sDoing">0</b><span>追劇中</span></div><div class="stat"><b id="sDone">0</b><span>已看完</span></div></div><div class="toolbar"><input class="search" id="q" placeholder="搜尋劇名、系列、備註…"><select id="country"><option value="">全部國家</option></select><select id="type"><option value="">全部類別</option></select></div><div class="tabs"><button class="tab on" data-tab="all">全部</button><button class="tab" data-tab="doing">追劇中</button><button class="tab" data-tab="todo">想看</button><button class="tab" data-tab="done">已看完</button></div><div class="io"><button class="btn" onclick="exportExcel()">匯出 Excel</button><button class="btn" onclick="exportBackup()">備份資料</button><label class="btn">還原備份<input id="importFile" type="file" accept=".json" hidden></label></div></div><div id="list" class="list"></div></div><button class="fab" onclick="editItem()">＋</button><div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel"><h2 id="formTitle">新增作品</h2><div class="grid"><div class="field full"><label>名稱</label><input id="fName"></div><div class="field"><label>國家</label><input id="fCountry"></div><div class="field"><label>類別</label><input id="fType"></div><div class="field"><label>季</label><input id="fSeason" type="number" step="1"></div><div class="field"><label>總集數</label><input id="fEpisodes"></div><div class="field"><label>目前看到</label><input id="fCurrent" type="number" step="1"></div><div class="field"><label>首播日期</label><input id="fDate" type="date"></div><div class="field"><label>作品狀態</label><select id="fStatus"><option>完結</option><option>連載中</option><option>未上映</option></select></div><div class="field"><label>OTT</label><input id="fOtt"></div><div class="field full"><label>系列作品</label><input id="fSeries"></div><div class="field full"><label>備註</label><textarea id="fNote" rows="3"></textarea></div><div class="field full"><label><input id="fDone" type="checkbox" style="width:auto"> 已看完</label></div></div><button class="save" onclick="saveItem()">儲存</button></div></div><script>
/* initial data loaded from data.js */let data=JSON.parse(localStorage.getItem('dramaListV1')||'null')||INITIAL;let tab='all',editing=null;const $=id=>document.getElementById(id);function persist(){localStorage.setItem('dramaListV1',JSON.stringify(data));$('saveState').textContent='已儲存 · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function state(x){if(x['看完']===true||String(x['看完']).toLowerCase()==='true')return'done';if(x['目前觀看']!==null&&x['目前觀看']!==''&&Number(x['目前觀看'])>0)return'doing';return'todo'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function num(v){let n=Number(v);return Number.isFinite(n)?n:null}function renderFilters(){for(const [id,key] of [['country','國'],['type','類別']]){let el=$(id),old=el.value,first=el.options[0].outerHTML;let vals=[...new Set(data.map(x=>x[key]).filter(Boolean))].sort();el.innerHTML=first+vals.map(v=>`<option>${esc(v)}</option>`).join('');el.value=old}}function render(){let q=$('q').value.trim().toLowerCase(),c=$('country').value,t=$('type').value;let rows=data.filter(x=>(tab==='all'||state(x)===tab)&&(!c||x['國']===c)&&(!t||x['類別']===t)&&(!q||[x['名稱'],x['系列作品'],x['備註'],x['OTT']].some(v=>String(v??'').toLowerCase().includes(q))));$('sAll').textContent=data.length;$('sDoing').textContent=data.filter(x=>state(x)==='doing').length;$('sDone').textContent=data.filter(x=>state(x)==='done').length;$('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">這區空得很乾淨。</div>'}function card(x){let total=num(x['集數']),cur=num(x['目前觀看'])||0,p=total?Math.min(100,Math.round(cur/total*100)):0,st=state(x),label=st==='done'?'已看完':st==='doing'?'追劇中':'想看';return`<div class="item"><div class="row"><div><div class="title">${esc(x['名稱'])}${x['季']?` <span class="small">S${esc(x['季'])}</span>`:''}</div><div class="meta">${[x['國'],x['類別'],x['首播年']?String(x['首播年']).slice(0,4):'',x['OTT']].filter(Boolean).map(esc).join(' · ')}</div></div><span class="badge">${label}</span></div>${st==='doing'?`<div class="progress"><div class="bar"><i style="width:${p}%"></i></div><span class="small">${cur}${total?' / '+esc(x['集數']):' 集'}</span></div>`:''}${x['備註']?`<div class="meta" style="margin-top:8px">${esc(x['備註'])}</div>`:''}<div class="actions">${st==='doing'?`<button onclick="inc(${x._id})">＋1 集</button>`:''}<button onclick="editItem(${x._id})">編輯</button>${st!=='done'?`<button onclick="markDone(${x._id})">看完</button>`:''}</div></div>`}function editItem(id){editing=id??null;let x=id==null?{}:data.find(v=>v._id===id)||{};$('formTitle').textContent=id==null?'新增作品':'編輯作品';$('fName').value=x['名稱']||'';$('fCountry').value=x['國']||'';$('fType').value=x['類別']||'';$('fSeason').value=x['季']??'';$('fEpisodes').value=x['集數']??'';$('fCurrent').value=x['目前觀看']??'';$('fDate').value=(x['首播年']||'').toString().slice(0,10);$('fStatus').value=x['狀態']||'完結';$('fOtt').value=x['OTT']||'';$('fSeries').value=x['系列作品']||'';$('fNote').value=x['備註']||'';$('fDone').checked=state(x)==='done';$('sheet').classList.add('on')}function closeSheet(){$('sheet').classList.remove('on')}function saveItem(){if(!$('fName').value.trim())return;let x=editing==null?{_id:Date.now()}:data.find(v=>v._id===editing);Object.assign(x,{'名稱':$('fName').value.trim(),'國':$('fCountry').value.trim(),'類別':$('fType').value.trim(),'季':$('fSeason').value?Number($('fSeason').value):null,'集數':$('fEpisodes').value||null,'目前觀看':$('fCurrent').value?Number($('fCurrent').value):null,'首播年':$('fDate').value||null,'狀態':$('fStatus').value,'OTT':$('fOtt').value.trim()||null,'系列作品':$('fSeries').value.trim()||null,'備註':$('fNote').value.trim()||null,'看完':$('fDone').checked});if(editing==null)data.unshift(x);persist();renderFilters();render();closeSheet()}function inc(id){let x=data.find(v=>v._id===id);x['目前觀看']=(num(x['目前觀看'])||0)+1;let total=num(x['集數']);if(total&&x['目前觀看']>=total)x['看完']=true;persist();render()}function markDone(id){let x=data.find(v=>v._id===id);x['看完']=true;let total=num(x['集數']);if(total)x['目前觀看']=total;persist();render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(v=>v.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;render()});['q','country','type'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));function xmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function exportExcel(){let cols=['看完','國','類別','名稱','季','集數','目前\\n觀看','首播年','狀態','系列作品','備註','OTT'];let rows=data.filter(x=>x['名稱']).map(x=>[!!x['看完'],x['國']||'',x['類別']||'',x['名稱']||'',x['季']??'',x['集數']??'',x['目前觀看']??'',x['首播年']||'',x['狀態']||'',x['系列作品']||'',x['備註']||'',x['OTT']||'']);let cell=v=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':typeof v==='boolean'?'Boolean':'String'}">${xmlEsc(v)}</Data></Cell>`;let xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="劇單"><Table><Row>${cols.map(cell).join('')}</Row>${rows.map(r=>`<Row>${r.map(cell).join('')}</Row>`).join('')}</Table></Worksheet></Workbook>`;download(new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'}),'劇單_匯出_'+new Date().toISOString().slice(0,10)+'.xls')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportBackup(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'劇單_備份_'+new Date().toISOString().slice(0,10)+'.json')}$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{try{let rows=JSON.parse(ev.target.result);if(!Array.isArray(rows))throw 0;data=rows;persist();renderFilters();render();alert('備份已還原');}catch(_){alert('這不是有效的劇單備份檔。')}};rd.readAsText(f)};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));renderFilters();render();</script></body></html>
