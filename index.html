</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="data.js"></script></head><body><div class="wrap"><div class="top"><h1>我的劇單</h1><div class="sub" id="saveState">資料存在這台裝置</div><div class="stats"><div class="stat"><b id="sAll">0</b><span>全部</span></div><div class="stat"><b id="sDoing">0</b><span>追劇中</span></div><div class="stat"><b id="sDone">0</b><span>已看完</span></div></div><div class="toolbar"><input id="q" placeholder="搜尋劇名、系列、備註、OTT…"><button class="btn" onclick="toggleFilters()">篩選 ⚙</button><select id="sort"><option value="new">最新加入</option><option value="old">最早加入</option><option value="name">名稱 A→Z</option><option value="dateDesc">首播新→舊</option><option value="dateAsc">首播舊→新</option></select></div><div class="tabs"><button class="tab on" data-tab="all">全部</button><button class="tab" data-tab="doing">追劇中</button><button class="tab" data-tab="todo">想看</button><button class="tab" data-tab="done">已看完</button></div><div id="filters" class="filters"><div class="filtergrid"><div class="filterbox"><b>國家（可複選）</b><div class="chips" id="fcountry"></div></div><div class="filterbox"><b>類別（可複選）</b><div class="chips" id="ftype"></div></div><div class="filterbox"><b>OTT（可複選）</b><div class="chips" id="fott"></div></div><div class="filterbox"><b>其他</b><div class="chips"><span class="chip" data-extra="note">有備註</span><span class="chip" data-extra="series">有系列</span></div><div class="range" style="margin-top:7px"><input id="yearFrom" placeholder="年份從" inputmode="numeric"><input id="yearTo" placeholder="到" inputmode="numeric"></div></div></div><button class="btn" style="margin-top:9px" onclick="clearFilters()">清除篩選</button></div><div class="viewbar"><button class="btn view" data-view="cards">卡片</button><button class="btn view on" data-view="compact">精簡</button><button class="btn view" data-view="table">表格</button></div><div class="io"><button class="btn" onclick="exportExcel()">匯出 Excel</button><button class="btn" onclick="expor let data=JSON.parse(localStorage.getItem('dramaListV1')||'null')||INITIAL;let tab='all',editing=null,view=localStorage.getItem('dramaView')||'compact';const selected={country:new Set(),type:new Set(),ott:new Set(),extra:new Set()};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const num=v=>{let n=Number(v);return Number.isFinite(n)?n:null};function state(x){if(x['看完']===true||String(x['看完']).toLowerCase()==='true')return'done';if(x['目前觀看']!==null&&x['目前觀看']!==''&&num(x['目前觀看'])>0)return'doing';return'todo'}function persist(){localStorage.setItem('dramaListV1',JSON.stringify(data));$('saveState').textContent='已儲存 · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function toggleFilters(){$('filters').classList.toggle('on')}function vals(key){return [...new Set(data.map(x=>x[key]).filter(Boolean).flatMap(v=>key==='OTT'?String(v).split(/[,、/]+/).map(s=>s.trim()).filter(Boolean):[String(v)]))].sort()}function renderFilterGroup(id,key,set){$(id).innerHTML=vals(key).map(v=>`<span class="chip ${set.has(v)?'on':''}" data-val="${esc(v)}">${esc(v)}</span>`).join('');$(id).querySelectorAll('.chip').forEach(el=>el.onclick=()=>{set.has(el.dataset.val)?set.delete(el.dataset.val):set.add(el.dataset.val);renderFilterGroup(id,key,set);render()})}function renderFilters(){renderFilterGroup('fcountry','國',selected.country);renderFilterGroup('ftype','類別',selected.type);renderFilterGroup('fott','OTT',selected.ott)}function clearFilters(){Object.values(selected).forEach(s=>s.clear());$('yearFrom').value='';$('yearTo').value='';document.querySelectorAll('[data-extra]').forEach(x=>x.classList.remove('on'));renderFilters();render()}function yearOf(v){let m=String(v??'').match(/(19|20)\d{2}/);return m?Number(m[0]):null}function filtered(){let q=$('q').value.trim().toLowerCase(),yf=Number($('yearFrom').value)||null,yt=Number($('yearTo').value)||null;let rows=data.filter(x=>{let ott=String(x['OTT']||'');let y=yearOf(x['首播年']);return(tab==='all'||state(x)===tab)&&(!selected.country.size||selected.country.has(String(x['國'])))&&(!selected.type.size||selected.type.has(String(x['類別'])))&&(!selected.ott.size||[...selected.ott].some(v=>ott.includes(v)))&&(!selected.extra.has('note')||!!x['備註'])&&(!selected.extra.has('series')||!!x['系列作品'])&&(!yf||y>=yf)&&(!yt||y<=yt)&&(!q||[x['名稱'],x['系列作品'],x['備註'],x['OTT'],x['國'],x['類別']].some(v=>String(v??'').toLowerCase().includes(q)))});let s=$('sort').value;if(s==='new')rows=rows.slice().reverse();else if(s==='old')rows=rows.slice();else if(s==='name')rows=rows.slice().sort((a,b)=>String(a['名稱']).localeCompare(String(b['名稱']),'zh-Hant'));else if(s==='dateDesc')rows=rows.slice().sort((a,b)=>(yearOf(b['首播年'])||0)-(yearOf(a['首播年'])||0));else if(s==='dateAsc')rows=rows.slice().sort((a,b)=>(yearOf(a['首播年'])||9999)-(yearOf(b['首播年'])||9999));return rows}function render(){let rows=filtered();$('sAll').textContent=data.length;$('sDoing').textContent=data.filter(x=>state(x)==='doing').length;$('sDone').textContent=data.filter(x=>state(x)==='done').length;$('resultCount').textContent=`顯示 ${rows.length} / ${data.length} 筆`;let list=$('list');if(view==='table'){list.className='tablewrap';list.innerHTML=tableHtml(rows)}else{list.className='list '+view;list.innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">這區空得很乾淨。</div>'}}function card(x){let total=num(x['集數']),cur=num(x['目前觀看'])||0,p=total?Math.min(100,Math.round(cur/total*100)):0,st=state(x),label=st==='done'?'已看完':st==='doing'?'追劇中':'想看';return`<div class="item"><div class="row"><div><div class="title">${esc(x['名稱'])}${x['季']?` <span class="small">S${esc(x['季'])}</span>`:''}</div><div class="meta">${[x['國'],x['類別'],x['首播年'],x['OTT']].filter(Boolean).map(esc).join(' · ')}</div></div><span class="badge">${label}</span></div>${st==='doing'&&total?`<div class="progress"><div class="small">進度 ${esc(x['目前觀看'])} / ${esc(x['集數'])} (${p}%)</div></div>`:''}${x['備註']?`<div class="meta note">${esc(x['備註'])}</div>`:''}<div class="actions"><button onclick="editItem(${x._id})">編輯</button>${st==='doing'&&num(x['目前觀看'])!==null?`<button onclick="inc(${x._id})">＋1</button>`:''}${st!=='done'?`<button onclick="markDone(${x._id})">看完</button>`:''}</div></div>`}function tableHtml(rows){if(!rows.length)return'<div class="empty">這區空得很乾淨。</div>';return`<table class="datatable"><thead><tr><th>名稱</th><th>國</th><th>類別</th><th>季</th><th>集數</th><th>目前</th><th>首播</th><th>狀態</th><th>OTT</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x['名稱'])}</td><td>${esc(x['國'])}</td><td>${esc(x['類別'])}</td><td>${esc(x['季'])}</td><td>${esc(x['集數'])}</td><td>${esc(x['目前觀看'])}</td><td>${esc(x['首播年'])}</td><td>${esc(state(x)==='done'?'已看完':x['狀態']||'')}</td><td>${esc(x['OTT'])}</td><td><button class="btn" onclick="editItem(${x._id})">編輯</button></td></tr>`).join('')}</tbody></table>`}function editItem(id){editing=id??null;let x=id==null?{}:data.find(v=>v._id===id)||{};$('formTitle').textContent=id==null?'新增作品':'編輯作品';$('fName').value=x['名稱']||'';$('fCountry').value=x['國']||'';$('fType').value=x['類別']||'';$('fSeason').value=x['季']??'';$('fEpisodes').value=x['集數']??'';$('fCurrent').value=x['目前觀看']??'';$('fDate').value=x['首播年']??'';$('fStatus').value=x['狀態']||'完結';$('fOtt').value=x['OTT']||'';$('fSeries').value=x['系列作品']||'';$('fNote').value=x['備註']||'';$('fDone').checked=state(x)==='done';$('sheet').classList.add('on')}function closeSheet(){$('sheet').classList.remove('on')}function saveItem(){if(!$('fName').value.trim())return;let x=editing==null?{_id:Date.now()}:data.find(v=>v._id===editing);Object.assign(x,{'名稱':$('fName').value.trim(),'國':$('fCountry').value,'類別':$('fType').value,'季':$('fSeason').value.trim()||null,'集數':$('fEpisodes').value.trim()||null,'目前觀看':$('fCurrent').value.trim()||null,'首播年':$('fDate').value.trim().replace(/-/g,'/')||null,'狀態':$('fStatus').value,'OTT':$('fOtt').value.trim()||null,'系列作品':$('fSeries').value.trim()||null,'備註':$('fNote').value.trim()||null,'看完':$('fDone').checked});if(editing==null)data.push(x);persist();renderFilters();render();closeSheet()}function inc(id){let x=data.find(v=>v._id===id),n=num(x['目前觀看']);if(n===null)return;x['目前觀看']=String(n+1);let total=num(x['集數']);if(total&&n+1>=total)x['看完']=true;persist();render()}function markDone(id){let x=data.find(v=>v._id===id);x['看完']=true;let total=num(x['集數']);if(total)x['目前觀看']=String(total);persist();render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(v=>v.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;render()});document.querySelectorAll('.view').forEach(b=>{if(b.dataset.view===view){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));b.classList.add('on')}b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));b.classList.add('on');view=b.dataset.view;localStorage.setItem('dramaView',view);render()}});document.querySelectorAll('[data-extra]').forEach(el=>el.onclick=()=>{let k=el.dataset.extra;selected.extra.has(k)?selected.extra.delete(k):selected.extra.add(k);el.classList.toggle('on');render()});['q','yearFrom','yearTo'].forEach(id=>$(id).addEventListener('input',render));$('sort').addEventListener('change',render);
function xmlEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function colName(n){let s='';while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}function inlineCell(ref,val,style){if(val===null||val===undefined||val==='')return'';return `<c r="${ref}"${style?` s="${style}"`:''} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`}async function exportExcel(){if(typeof JSZip==='undefined'){alert('Excel 匯出元件尚未載入');return}try{let resp=await fetch('./drama-list-template.xlsx',{cache:'no-store'});if(!resp.ok)throw Error('找不到 Excel 模板');let buf=await resp.arrayBuffer(),zip=await JSZip.loadAsync(buf);let wbXml=await zip.file('xl/workbook.xml').async('text'),rels=await zip.file('xl/_rels/workbook.xml.rels').async('text');let m=wbXml.match(/<sheet[^>]*name="劇單"[^>]*r:id="([^"]+)"/);if(!m)throw Error('找不到劇單工作表');let rid=m[1],rm=rels.match(new RegExp(`<Relationship[^>]*Id="${rid}"[^>]*Target="([^"]+)"`));if(!rm)throw Error('找不到劇單工作表路徑');let target=rm[1].replace(/^\//,'');if(!target.startsWith('xl/'))target='xl/'+target.replace(/^\.\//,'');let xml=await zip.file(target).async('text');let sd=xml.match(/<sheetData>([\s\S]*?)<\/sheetData>/);if(!sd)throw Error('工作表格式異常');let header=(sd[1].match(/<row[^>]*r="1"[^>]*>[\s\S]*?<\/row>/)||[''])[0];let row2=(sd[1].match(/<row[^>]*r="2"[^>]*>[\s\S]*?<\/row>/)||[''])[0];let styles={};for(let c=1;c<=13;c++){let L=colName(c),mm=row2.match(new RegExp(`<c[^>]*r="${L}2"[^>]*`));styles[c]=mm?(mm[0].match(/\bs="(\d+)"/)||[])[1]||'':''}let rows=data.map((x,i)=>{let r=i+2,vals=[x['看完']===true?'TRUE':'FALSE',x['國'],x['類別'],x['名稱'],x['季'],x['集數'],x['目前觀看'],x['首播年'],x['狀態'],x['系列作品'],x['備註'],x['OTT']];let cells=vals.map((v,j)=>inlineCell(colName(j+1)+r,v,styles[j+1])).join('');cells+=`<c r="M${r}"${styles[13]?` s="${styles[13]}"`:''}><f>CONCATENATE(C${r},D${r}," ",E${r})</f></c>`;return `<row r="${r}">${cells}</row>`}).join('');let newSd=`<sheetData>${header}${rows}</sheetData>`;xml=xml.replace(/<sheetData>[\s\S]*?<\/sheetData>/,newSd);let max=data.length+1;xml=xml.replace(/<dimension ref="[^"]+"\/>/,`<dimension ref="A1:M${max}"/>`);zip.file(target,xml);let out=await zip.generateAsync({type:'blob',compression:'DEFLATE'});download(out,'劇單_匯出_'+new Date().toISOString().slice(0,10)+'.xlsx')}catch(e){console.error(e);alert('匯出失敗：'+e.message)}}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportBackup(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'劇單_備份_'+new Date().toISOString().slice(0,10)+'.json')}$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{try{let rows=JSON.parse(ev.target.result);if(!Array.isArray(rows))throw 0;data=rows;persist();renderFilters();render();alert('備份已還原')}catch(_){alert('這不是有效的劇單備份檔')}};rd.readAsText(f)};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));renderFilters();render();
